<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hour Booster | Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="theme-color" content="#dc2626">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#0e0e10] flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md px-4">
    <div class="flex items-center mb-8 cursor-pointer" onclick="window.location.href='/'">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      <span class="text-white text-xl font-bold">Go Back</span>
    </div>

    <div class="bg-white/5 border border-white/10 rounded-3xl p-8 backdrop-blur">
      <h2 class="font-bold bg-gradient-to-r from-red-500 to-red-700 text-transparent bg-clip-text text-center text-3xl mb-2">
        Hour Booster
      </h2>
      <p class="text-white/60 text-center text-sm mb-8">Create your free account</p>

      <form id="register-form" class="space-y-4">
        <div>
          <label for="email" class="block text-white/70 mb-2 text-sm font-medium">Email</label>
          <input id="email" type="email" name="email" required autofocus
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
            placeholder="your@email.com">
        </div>

        <div>
          <label for="username" class="block text-white/70 mb-2 text-sm font-medium">Username</label>
          <input id="username" type="text" name="username" required
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
            placeholder="yourname" minlength="3">
        </div>

        <div>
          <label for="password" class="block text-white/70 mb-2 text-sm font-medium">Password</label>
          <input id="password" type="password" name="password" required
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
            placeholder="••••••••" minlength="8">
          <p class="text-white/50 text-xs mt-1">At least 8 characters</p>
        </div>

        <div>
          <label for="confirmPassword" class="block text-white/70 mb-2 text-sm font-medium">Confirm Password</label>
          <input id="confirmPassword" type="password" name="confirmPassword" required
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
            placeholder="••••••••">
        </div>

        <div id="error-message" class="hidden bg-red-500/20 border border-red-500/40 text-red-300 text-sm p-3 rounded-lg"></div>

        <button type="submit" class="w-full py-3 font-semibold rounded-lg bg-gradient-to-r from-red-500 to-red-700 hover:from-red-600 hover:to-red-800 transition-all duration-300 text-white">
          Create Account
        </button>
      </form>

      <div class="mt-6 text-center text-white/70 text-sm">
        Already have an account?
        <a href="/login" class="text-red-500 hover:text-red-400 font-semibold transition">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('error-message');

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, username, password, confirmPassword }),
        });

        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = data.error || 'Registration failed';
          errorDiv.classList.remove('hidden');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard';
      } catch (error) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
        console.error('Registration error:', error);
      }
    });
  </script>
</body>
</html>
